openapi: 3.1.0
info:
  title: Fajr Shop API
  version: 0.1.0
  description: |
    The only way into a Fajr shop. The storefront, admin, mobile apps and integrations all use it.

    Errors always look like `{"error": {"code": "...", "message": "...", "fields": {...}}}`.
    `code` is stable and machine-readable; show your own words for it. `message` is English and
    may change.

    Money is an integer in the currency's minor unit (poisha for BDT) and always comes with
    its `currency`.
servers:
  - url: /
tags:
  - name: system
  - name: store
  - name: auth
  - name: admin

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Is the API up and can it reach its database
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"

  /v1/store:
    get:
      operationId: getStore
      tags: [store]
      summary: The shop's public settings
      description: Name, branding, currency and VAT. Every client reads this on start.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Store settings
          headers:
            ETag:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "304":
          description: Unchanged since the given ETag
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a customer account and sign in
      description: Needs an email or a phone number, or both. Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email or phone and password
      description: |
        A wrong password and an unknown account give the same `invalid_credentials` error.
        Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Swap a refresh token for a new pair
      description: |
        Every refresh token works once. Using one twice ends the session for everyone holding it
        (`session_expired`); sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End this session
      security:
        - bearer: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/store:
    put:
      operationId: updateStore
      tags: [admin]
      summary: Change the shop's settings
      description: "Needs `store:write`. Send every field; a missing optional field is cleared."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: Active API keys
      description: Needs `api_keys:manage` and a signed-in user. Returns at most 200.
      security:
        - bearer: []
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      tags: [admin]
      summary: Create an API key for an integration
      description: The key is in this response only. It cannot be shown again.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [admin]
      summary: Revoke an API key; it stops working at once
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/audit-log:
    get:
      operationId: listAuditLog
      tags: [admin]
      summary: Who changed what, newest first
      description: Needs `audit:read`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token from sign-in (`fsa_…`) or an API key (`fsk_…`).

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: "`next_cursor` from the previous page."
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error:
      description: Something went wrong; `error.code` says what
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            fields:
              description: Per-field problems, keyed by field path.
              type: object
              additionalProperties:
                type: string

    ErrorCode:
      type: string
      enum:
        - validation
        - not_found
        - method_not_allowed
        - unauthenticated
        - session_expired
        - forbidden
        - invalid_credentials
        - account_exists
        - rate_limited
        - internal

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Store:
      type: object
      required: [name, currency, vat]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        logo_url:
          type: [string, "null"]
          maxLength: 500
        accent_color:
          description: Hex color, e.g. "#0f766e".
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        currency:
          description: ISO 4217 code.
          type: string
          pattern: "^[A-Z]{3}$"
        contact_phone:
          type: [string, "null"]
          maxLength: 20
        contact_email:
          type: [string, "null"]
          format: email
          maxLength: 254
        vat:
          $ref: "#/components/schemas/Vat"

    Vat:
      type: object
      required: [enabled, rate_bp, prices_include_vat]
      properties:
        enabled:
          type: boolean
        rate_bp:
          description: Default rate in basis points (500 = 5%).
          type: integer
          minimum: 0
          maximum: 10000
        prices_include_vat:
          type: boolean
        bin:
          description: Business Identification Number, printed on Mushak-6.3 invoices.
          type: [string, "null"]
          maxLength: 20

    Role:
      type: string
      enum: [customer, staff, admin]

    Permission:
      description: What a user's role or an API key allows.
      type: string
      enum: [store:write, api_keys:manage, audit:read]

    ApiKeyScope:
      description: What an API key may do. Managing keys is for signed-in people only.
      type: string
      enum: [store:write, audit:read]

    User:
      type: object
      required: [id, role, name, permissions, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        email:
          type: [string, "null"]
        phone:
          description: E.164, e.g. "+8801712345678".
          type: [string, "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          description: A Bangladeshi mobile number, e.g. "01712345678".
          type: string
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          description: Email or phone number.
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200

    Session:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ApiKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"

    ApiKey:
      type: object
      required: [id, name, hint, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          description: The key's last four characters.
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string

    AuditEntry:
      type: object
      required: [id, action, entity, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          description: Who did it, or null for the system.
          type: [string, "null"]
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: [string, "null"]
        before: {}
        after: {}
        created_at:
          type: string
          format: date-time

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: [string, "null"]
