openapi: 3.1.0
info:
  title: Fajr Shop API
  version: 0.1.0
  description: |
    The only way into a Fajr shop. The storefront, admin, mobile apps and integrations all use it.

    Errors always look like `{"error": {"code": "...", "message": "...", "fields": {...}}}`.
    `code` is stable and machine-readable; show your own words for it. `message` is English and
    may change.

    Money is an integer in the currency's minor unit (poisha for BDT) and always comes with
    its `currency`.
servers:
  - url: /
tags:
  - name: system
  - name: store
  - name: auth
  - name: catalog
  - name: cart
  - name: shipping
  - name: discounts
  - name: reviews
  - name: orders
  - name: admin

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Is the API up and can it reach its database
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"

  /v1/store:
    get:
      operationId: getStore
      tags: [store]
      summary: The shop's public settings
      description: Name, branding, currency and VAT. Every client reads this on start.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Store settings
          headers:
            ETag:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "304":
          description: Unchanged since the given ETag
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a customer account and sign in
      description: Needs an email or a phone number, or both. Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email or phone and password
      description: |
        A wrong password and an unknown account give the same `invalid_credentials` error.
        Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Swap a refresh token for a new pair
      description: |
        Every refresh token works once. Using one twice ends the session for everyone holding it
        (`session_expired`); sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End this session
      security:
        - bearer: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/store:
    put:
      operationId: updateStore
      tags: [admin]
      summary: Change the shop's settings
      description: "Needs `store:write`. Send every field; a missing optional field is cleared."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: Active API keys
      description: Needs `api_keys:manage` and a signed-in user. Returns at most 200.
      security:
        - bearer: []
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      tags: [admin]
      summary: Create an API key for an integration
      description: The key is in this response only. It cannot be shown again.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [admin]
      summary: Revoke an API key; it stops working at once
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/audit-log:
    get:
      operationId: listAuditLog
      tags: [admin]
      summary: Who changed what, newest first
      description: Needs `audit:read`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Error"

  /v1/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: Every category, in display order
      description: A flat list; build the tree from `parent_id`. At most 500.
      responses:
        "200":
          description: Categories
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"

  /v1/products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Products for sale, filtered and sorted
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/InStockOnly"
        - $ref: "#/components/parameters/BrandFilter"
        - $ref: "#/components/parameters/FeaturedOnly"
        - $ref: "#/components/parameters/OnSaleOnly"
        - $ref: "#/components/parameters/OptionFilter"
        - name: ids
          in: query
          description: Only these products (a guest's saved items, say). Repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, name]
            default: newest
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"

  /v1/products/facets:
    get:
      operationId: listProductFacets
      tags: [catalog]
      summary: What the current filters could still narrow to, with counts
      description: |
        Takes the same filters as the product list. Each group's counts ignore that group's own
        filter, so ticking a second brand shows how many it adds rather than zero.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/InStockOnly"
        - $ref: "#/components/parameters/BrandFilter"
        - $ref: "#/components/parameters/FeaturedOnly"
        - $ref: "#/components/parameters/OnSaleOnly"
        - $ref: "#/components/parameters/OptionFilter"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facets"
        default:
          $ref: "#/components/responses/Error"

  /v1/products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: One product for sale, with its variants and images
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/categories:
    post:
      operationId: createCategory
      tags: [admin]
      summary: Add a category
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateCategory
      tags: [admin]
      summary: Rename, move or reorder a category
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Remove a category
      description: "Needs `catalog:write`. Refused with `in_use` while it has products or subcategories."
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: Every product, drafts and archived included, newest first
      description: Needs `catalog:write`.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Add a product
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminGetProduct
      tags: [admin]
      summary: One product, whatever its status
      description: Needs `catalog:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Replace a product's details, options, variants and images
      description: |
        Needs `catalog:write`. Variants are matched by `id`; one left out is removed, one without an
        `id` is added. An existing variant's `stock` is ignored here: change it with a stock adjustment,
        so a form opened before a sale can't undo it.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Remove a product for good
      description: Needs `catalog:write`. To hide it but keep it, set its status to `archived`.
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/variants/{id}/stock-adjustments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adjustStock
      tags: [admin]
      summary: Add to or take from a variant's stock, saying why
      description: "Needs `inventory:write`. Refused with `insufficient_stock` if it would go below zero."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustment"
      responses:
        "200":
          description: The variant, with its new stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/uploads:
    post:
      operationId: uploadImage
      tags: [admin]
      summary: Upload a JPEG, PNG or WebP image, up to 10 MB
      description: Needs `catalog:write` or `store:write`. Use the returned `id` in a product's `image_ids`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        default:
          $ref: "#/components/responses/Error"

  /v1/cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: The shopper's cart
      description: |
        A signed-in customer's cart comes from their access token. A guest's comes from the
        `X-Cart-Token` they were given; without one (or with one that has expired) the cart is empty.
        Prices are always today's, so a cart can change between visits.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"

  /v1/cart/items/{variant_id}:
    parameters:
      - name: variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/CartToken"
    put:
      operationId: setCartItem
      tags: [cart]
      summary: Set how many of a variant are in the cart
      description: |
        `0` removes it. A guest with no cart gets one, and its token comes back in `token` once:
        keep it and send it as `X-Cart-Token`. Refused with `insufficient_stock` beyond what's in stock.
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"

  /v1/cart/merge:
    post:
      operationId: mergeCart
      tags: [cart]
      summary: Move a guest cart into the signed-in customer's cart
      description: Call right after sign-in. Quantities of the same variant add up, to at most 99.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_token]
              properties:
                cart_token:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: The customer's cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"

  /v1/cart/discount:
    parameters:
      - $ref: "#/components/parameters/CartToken"
    put:
      operationId: applyCartDiscount
      tags: [cart, discounts]
      summary: Use a discount code on the cart
      description: |
        Replaces any code already on it. A code that doesn't exist, isn't on, hasn't started, has
        ended or is used up is refused (`validation`, on `code`). A code whose minimum order isn't
        met yet is kept: `discount.applies` is false and `discount.note` says what's missing.
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 30
      responses:
        "200":
          description: The cart with the code on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeCartDiscount
      tags: [cart, discounts]
      summary: Take the discount code off the cart
      security:
        - {}
        - bearer: []
      responses:
        "200":
          description: The cart without a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/discounts:
    get:
      operationId: adminListDiscounts
      tags: [admin, discounts]
      summary: Every discount code, newest first
      description: Needs `store:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: Discounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Discount"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDiscount
      tags: [admin, discounts]
      summary: Add a discount code
      description: "Needs `store:write`. Codes are unique, ignoring case."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/discounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateDiscount
      tags: [admin, discounts]
      summary: Change a discount code
      description: Needs `store:write`. How many times it has been used is kept.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDiscount
      tags: [admin, discounts]
      summary: Remove a discount code
      description: Needs `store:write`. Carts using it lose it.
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/wishlist:
    get:
      operationId: getWishlist
      tags: [reviews]
      summary: The signed-in customer's saved products, newest first
      security:
        - bearer: []
      responses:
        "200":
          description: Saved products (any no longer for sale are left out)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/wishlist/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: addToWishlist
      tags: [reviews]
      summary: Save a product (saving it twice is fine)
      security:
        - bearer: []
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFromWishlist
      tags: [reviews]
      summary: Unsave a product
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/products/{slug}/reviews:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
    get:
      operationId: listReviews
      tags: [reviews]
      summary: A product's reviews, newest first, with its star counts
      description: Signed in, `mine` is the caller's own review (even one the shop has hidden).
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        default:
          $ref: "#/components/responses/Error"

  /v1/products/{slug}/reviews/mine:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
    put:
      operationId: saveMyReview
      tags: [reviews]
      summary: Write or change the caller's review of this product
      description: One review per customer per product; saving again replaces it.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                body:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyReview
      tags: [reviews]
      summary: Delete the caller's review of this product
      security:
        - bearer: []
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /v1/products/{slug}/questions:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
    get:
      operationId: listQuestions
      tags: [reviews]
      summary: Questions the shop has answered, plus the caller's own still waiting
      security:
        - {}
        - bearer: []
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Question"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: askQuestion
      tags: [reviews]
      summary: Ask the shop about this product
      description: Shown to others once the shop answers it.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: Asked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/reviews:
    get:
      operationId: adminListReviews
      tags: [admin, reviews]
      summary: The latest reviews across all products, hidden ones included
      description: Needs `catalog:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: moderateReview
      tags: [admin, reviews]
      summary: Hide a review from shoppers, or show it again
      description: Needs `catalog:write`. Hidden reviews don't count toward the product's rating.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden:
                  type: boolean
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/questions:
    get:
      operationId: adminListQuestions
      tags: [admin, reviews]
      summary: The latest questions across all products
      description: Needs `catalog:write`.
      security:
        - bearer: []
      parameters:
        - name: waiting
          in: query
          description: Only questions not yet answered or hidden.
          schema:
            type: boolean
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Question"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/questions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: answerQuestion
      tags: [admin, reviews]
      summary: Answer a question, or hide it
      description: Needs `catalog:write`. A null answer takes an answer back.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                answer:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 2000
                hidden:
                  type: boolean
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        default:
          $ref: "#/components/responses/Error"

  /v1/checkout:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place an order from the cart
      description: |
        Prices, discount, delivery and VAT are worked out here from the cart as it is now; nothing is
        taken from the request but who and where. Stock is taken in the same step. Refused with
        `cart_empty`, `cart_changed` (a line can no longer be bought, or the discount no longer
        applies: look at the cart again), `insufficient_stock` or `not_deliverable`. The response's
        `token` is the order's private link for a guest; it is shown once.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema:
                type: object
                required: [order, token]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  token:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /v1/orders:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: The signed-in customer's orders, newest first
      security:
        - bearer: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderSummary"
        default:
          $ref: "#/components/responses/Error"

  /v1/orders/{number}:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: getOrder
      tags: [orders]
      summary: One order, for its customer or whoever holds its link
      security:
        - {}
        - bearer: []
      parameters:
        - name: token
          in: query
          description: The order's link token, from placing it.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin, orders]
      summary: Orders, newest first
      description: Needs `orders:write`.
      security:
        - bearer: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: q
          in: query
          description: An order number, a phone number (any 4+ of its digits) or part of the customer's name.
          schema:
            type: string
            maxLength: 80
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderSummary"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/orders/{number}:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: adminGetOrder
      tags: [admin, orders]
      summary: One order
      description: Needs `orders:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/orders/{number}/shipment:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: bookShipment
      tags: [admin, orders]
      summary: Book the order's parcel with a courier
      description: |
        Needs `orders:write`. The order must be confirmed or packed and not booked yet
        (`already_booked`). The courier must be switched on in Integrations. The rider collects the
        order total. On success the order moves to shipped. A courier's refusal is `courier_error`
        with its reason.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  type: string
                  maxLength: 32
      responses:
        "200":
          description: Booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/orders/{number}/shipment/refresh:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: refreshShipment
      tags: [admin, orders]
      summary: Ask the courier where the parcel is
      description: Needs `orders:write`. A delivered parcel moves a shipped order to delivered.
      security:
        - bearer: []
      responses:
        "200":
          description: The order with the courier's latest status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/couriers:
    get:
      operationId: adminListCouriers
      tags: [admin, orders]
      summary: Couriers switched on, to book parcels with
      description: Needs `orders:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: Couriers that are on
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name]
                      properties:
                        code:
                          type: string
                        name:
                          type: string
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/orders/{number}/status:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: setOrderStatus
      tags: [admin, orders]
      summary: Move an order on (confirm, pack, ship, deliver) or cancel it
      description: |
        Needs `orders:write`. Only the moves in the order's `next_statuses` are allowed; `from` must be
        the status you saw, else `status_changed` (someone else moved it first). Cancelling puts the
        stock back.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  $ref: "#/components/schemas/OrderStatus"
                to:
                  $ref: "#/components/schemas/OrderStatus"
                note:
                  type: string
                  maxLength: 300
      responses:
        "200":
          description: The order after the move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/customers:
    get:
      operationId: adminListCustomers
      tags: [admin, orders]
      summary: Customer accounts, newest first, with what they've ordered
      description: Needs `orders:write`. Guests have no account; find their orders by phone instead.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          description: Part of a name or email, or 4+ digits of a phone number.
          schema:
            type: string
            maxLength: 80
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerSummary"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminGetCustomer
      tags: [admin, orders]
      summary: One customer with their orders
      description: Needs `orders:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/staff:
    get:
      operationId: adminListStaff
      tags: [admin]
      summary: The shop's team, admins and staff
      description: Needs `store:write`, signed in (not an API key).
      security:
        - bearer: []
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addStaff
      tags: [admin]
      summary: Add someone to the team
      description: |
        Needs `store:write`, signed in. They sign in to the dashboard with this email and password;
        share the password with them yourself. `account_exists` if the email or phone is taken.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                  format: email
                  maxLength: 254
                phone:
                  type: [string, "null"]
                  maxLength: 20
                role:
                  $ref: "#/components/schemas/StaffRole"
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateStaff
      tags: [admin]
      summary: Change someone's role, or switch their access off or on
      description: |
        Needs `store:write`, signed in. Not your own account, and never so that no admin is left.
        Switched off, they can't sign in and any session they have stops working at once.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, disabled]
              properties:
                role:
                  $ref: "#/components/schemas/StaffRole"
                disabled:
                  type: boolean
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"

  /v1/banners:
    get:
      operationId: listBanners
      tags: [catalog]
      summary: The shop's active banners, in display order
      description: "`hero` slides at the top, `side` beside them, `wide` across the page further down."
      responses:
        "200":
          description: Banners
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Banner"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/banners:
    get:
      operationId: adminListBanners
      tags: [admin]
      summary: Every banner, hidden ones included
      description: Needs `catalog:write`. At most 100.
      security:
        - bearer: []
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Banner"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBanner
      tags: [admin]
      summary: Add a banner
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/banners/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateBanner
      tags: [admin]
      summary: Change a banner
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBanner
      tags: [admin]
      summary: Remove a banner
      description: Needs `catalog:write`.
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/brands:
    get:
      operationId: listBrands
      tags: [catalog]
      summary: Brands with products for sale, most products first
      description: At most 50.
      responses:
        "200":
          description: Brands
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/overview:
    get:
      operationId: adminOverview
      tags: [admin]
      summary: The numbers on the dashboard's home page
      description: Needs `catalog:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        default:
          $ref: "#/components/responses/Error"

  /v1/districts:
    get:
      operationId: listDistricts
      tags: [shipping]
      summary: Bangladesh's 64 districts, by division
      responses:
        "200":
          description: Districts
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/District"
        default:
          $ref: "#/components/responses/Error"

  /v1/shipping/zones:
    get:
      operationId: listShippingZones
      tags: [shipping]
      summary: Where the shop delivers, and what it charges
      responses:
        "200":
          description: Active zones in display order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShippingZone"
        default:
          $ref: "#/components/responses/Error"

  /v1/cart/shipping-quote:
    post:
      operationId: quoteCartShipping
      tags: [cart]
      summary: The delivery charge for this cart to a district
      description: |
        Uses the cart's weight and subtotal, so it changes as the cart does. `not_deliverable`
        when no zone covers the district.
      security:
        - {}
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CartToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district]
              properties:
                district:
                  type: string
                  maxLength: 40
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingQuote"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/providers:
    get:
      operationId: adminListProviders
      tags: [admin]
      summary: Couriers, payment gateways and SMS gateways the shop can connect
      description: "Admins signed in only. Saved keys and passwords are never sent back; `set` says whether one is saved."
      security:
        - bearer: []
      responses:
        "200":
          description: Every provider, set up or not
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/providers/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z]+$"
          maxLength: 32
    put:
      operationId: updateProvider
      tags: [admin]
      summary: Set up a provider, change its keys, or switch it on or off
      description: >-
        Admins signed in only. A secret left out or empty keeps the saved one. Switching on needs every
        required field. Switching an SMS gateway on switches the other SMS gateways off.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/shipping-zones:
    get:
      operationId: adminListShippingZones
      tags: [admin]
      summary: Every delivery zone, inactive ones included
      description: Needs `store:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShippingZone"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createShippingZone
      tags: [admin]
      summary: Add a delivery zone
      description: "Needs `store:write`. A district may be in only one active zone."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingZoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingZone"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/shipping-zones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateShippingZone
      tags: [admin]
      summary: Change a delivery zone
      description: Needs `store:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingZoneInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingZone"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteShippingZone
      tags: [admin]
      summary: Remove a delivery zone
      description: Needs `store:write`.
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token from sign-in (`fsa_…`) or an API key (`fsk_…`).

  parameters:
    SearchQuery:
      name: q
      in: query
      description: Words to search for in names and descriptions.
      schema:
        type: string
        maxLength: 100
    CategorySlug:
      name: category
      in: query
      description: A category slug; products in its subcategories are included.
      schema:
        type: string
        maxLength: 100
    MinPrice:
      name: min_price
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
    MaxPrice:
      name: max_price
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
    InStockOnly:
      name: in_stock
      in: query
      schema:
        type: boolean
    BrandFilter:
      name: brand
      in: query
      description: Only these brands (exact names, as facets give them). Repeat for several; any matches.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 30
        items:
          type: string
          maxLength: 80
    FeaturedOnly:
      name: featured
      in: query
      description: Only products the shop marked as featured.
      schema:
        type: boolean
    OnSaleOnly:
      name: on_sale
      in: query
      description: Only products with a variant priced below its old price.
      schema:
        type: boolean
    OptionFilter:
      name: option
      in: query
      description: |
        `Name:Value`, e.g. `Size:M`. Values of one option match any of them; different options must
        all match the same variant (`Size:M&Size:L&Color:Red`: a red M or a red L).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 30
        items:
          type: string
          maxLength: 100
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: A guest's cart, from an earlier `token`.
      schema:
        type: string
        maxLength: 200
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: "`next_cursor` from the previous page."
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error:
      description: Something went wrong; `error.code` says what
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            fields:
              description: Per-field problems, keyed by field path.
              type: object
              additionalProperties:
                type: string

    ErrorCode:
      type: string
      enum:
        - validation
        - not_found
        - method_not_allowed
        - unauthenticated
        - session_expired
        - forbidden
        - invalid_credentials
        - account_exists
        - in_use
        - already_booked
        - courier_error
        - not_deliverable
        - cart_empty
        - cart_changed
        - status_changed
        - insufficient_stock
        - too_large
        - unsupported_type
        - rate_limited
        - internal

    Provider:
      type: object
      required: [code, kind, name, enabled, live, configured, fields]
      properties:
        code:
          type: string
        kind:
          type: string
          enum: [courier, payment, sms]
        name:
          type: string
        enabled:
          type: boolean
        live:
          type: boolean
          description: Real money and parcels; false is the provider's test (sandbox) mode.
        configured:
          type: boolean
          description: Every required field is saved.
        updated_at:
          type: [string, "null"]
          format: date-time
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProviderField"

    ProviderField:
      type: object
      required: [key, label, secret, optional, set]
      properties:
        key:
          type: string
        label:
          type: string
        secret:
          type: boolean
        optional:
          type: boolean
        set:
          type: boolean
        value:
          type: string
          description: The saved value, for fields that aren't secret.

    ProviderInput:
      type: object
      additionalProperties: false
      required: [enabled, live]
      properties:
        enabled:
          type: boolean
        live:
          type: boolean
        values:
          type: object
          additionalProperties:
            type: string
            maxLength: 4000

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Store:
      type: object
      required: [name, currency, vat]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        logo_url:
          type: [string, "null"]
          maxLength: 500
        accent_color:
          description: Hex color, e.g. "#0f766e".
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        currency:
          description: ISO 4217 code.
          type: string
          pattern: "^[A-Z]{3}$"
        contact_phone:
          type: [string, "null"]
          maxLength: 20
        whatsapp:
          description: A mobile number (01XXXXXXXXX) shoppers can message to order; null hides the button.
          type: [string, "null"]
          pattern: "^01[3-9][0-9]{8}$"
        contact_email:
          type: [string, "null"]
          format: email
          maxLength: 254
        vat:
          $ref: "#/components/schemas/Vat"
        highlights:
          description: Up to four promises shown in a strip on the home page, e.g. cash on delivery.
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Highlight"

    Vat:
      type: object
      required: [enabled, rate_bp, prices_include_vat]
      properties:
        enabled:
          type: boolean
        rate_bp:
          description: Default rate in basis points (500 = 5%).
          type: integer
          minimum: 0
          maximum: 10000
        prices_include_vat:
          type: boolean
        bin:
          description: Business Identification Number, printed on Mushak-6.3 invoices.
          type: [string, "null"]
          maxLength: 20

    Role:
      type: string
      enum: [customer, staff, admin]

    Permission:
      description: What a user's role or an API key allows.
      type: string
      enum: [store:write, catalog:write, inventory:write, orders:write, api_keys:manage, audit:read]

    ApiKeyScope:
      description: What an API key may do. Managing keys is for signed-in people only.
      type: string
      enum: [store:write, catalog:write, inventory:write, orders:write, audit:read]

    User:
      type: object
      required: [id, role, name, permissions, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        email:
          type: [string, "null"]
        phone:
          description: E.164, e.g. "+8801712345678".
          type: [string, "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          description: A Bangladeshi mobile number, e.g. "01712345678".
          type: string
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          description: Email or phone number.
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200

    Session:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ApiKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"

    ApiKey:
      type: object
      required: [id, name, hint, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          description: The key's last four characters.
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string

    AuditEntry:
      type: object
      required: [id, action, entity, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          description: Who did it, or null for the system.
          type: [string, "null"]
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: [string, "null"]
        before: {}
        after: {}
        created_at:
          type: string
          format: date-time

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: [string, "null"]

    Category:
      type: object
      required: [id, name, slug, position]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        slug:
          type: string
        position:
          description: Order among its siblings, from 0.
          type: integer
        image:
          description: Shown as the category's round picture.
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          description: Made from the name when left out.
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
        parent_id:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
          minimum: 0
        image_id:
          description: An uploaded image, or null for none.
          type: [string, "null"]
          format: uuid

    ProductStatus:
      description: Only `active` products are for sale.
      type: string
      enum: [draft, active, archived]

    Image:
      type: object
      required: [id, url, width, height]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        alt:
          type: string
        width:
          type: integer
        height:
          type: integer

    ProductOption:
      type: object
      required: [name, values]
      properties:
        name:
          description: E.g. "Size" or "Color".
          type: string
          minLength: 1
          maxLength: 40
        values:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40

    Variant:
      type: object
      required: [id, price, stock, weight_g, options]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: [string, "null"]
        price:
          type: integer
          format: int64
        compare_at_price:
          description: The old price, shown struck through, when on sale.
          type: [integer, "null"]
          format: int64
        stock:
          type: integer
        weight_g:
          description: Packed weight in grams, for the delivery charge.
          type: integer
        options:
          description: 'This variant''s value for each of the product''s options, e.g. {"Size": "M"}.'
          type: object
          additionalProperties:
            type: string

    VariantInput:
      type: object
      required: [price, options]
      properties:
        id:
          description: An existing variant to keep; leave out to add a new one.
          type: string
          format: uuid
        sku:
          type: [string, "null"]
          maxLength: 64
        price:
          type: integer
          format: int64
          minimum: 0
        compare_at_price:
          type: [integer, "null"]
          format: int64
          minimum: 0
        stock:
          description: Starting stock for a new variant. Ignored for an existing one.
          type: integer
          minimum: 0
        weight_g:
          description: Packed weight in grams. 500 when left out.
          type: integer
          minimum: 0
          maximum: 1000000
        options:
          type: object
          additionalProperties:
            type: string

    Product:
      type: object
      required: [id, slug, name, description, status, featured, currency, options, variants, images, created_at, updated_at, rating_count]
      properties:
        rating_count:
          type: integer
        rating_average:
          type: [number, "null"]
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        featured:
          type: boolean
        brand:
          type: [string, "null"]
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        currency:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name, status, options, variants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          description: Made from the name when left out.
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
        description:
          type: string
          maxLength: 20000
        status:
          $ref: "#/components/schemas/ProductStatus"
        featured:
          description: Shown in the home page's featured section.
          type: boolean
        brand:
          type: [string, "null"]
          maxLength: 80
        category_id:
          type: [string, "null"]
          format: uuid
        options:
          description: Up to three, e.g. Size and Color. Empty for a product with one variant.
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          description: One per combination of option values you sell.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/VariantInput"
        image_ids:
          description: Uploaded images, in display order; the first is the main one.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid

    ProductSummary:
      type: object
      required: [id, slug, name, status, price_min, price_max, currency, in_stock, rating_count]
      properties:
        rating_count:
          type: integer
        rating_average:
          description: Average stars of the visible reviews; null with none.
          type: [number, "null"]
        single_variant_id:
          description: The variant to add to the cart straight from a list, when the product has only one.
          type: [string, "null"]
          format: uuid
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        brand:
          type: [string, "null"]
        price_min:
          type: integer
          format: int64
        price_max:
          type: integer
          format: int64
        compare_at_price:
          description: The old price of the cheapest variant, when it is on sale.
          type: [integer, "null"]
          format: int64
        currency:
          type: string
        in_stock:
          type: boolean
        image:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"

    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        next_cursor:
          type: [string, "null"]

    StockAdjustment:
      type: object
      required: [delta, reason]
      properties:
        delta:
          description: Positive adds, negative takes away. Not zero.
          type: integer
          minimum: -100000
          maximum: 100000
        reason:
          type: string
          enum: [received, damaged, lost, returned, correction]
        note:
          type: string
          maxLength: 200

    CartItem:
      type: object
      required: [variant_id, product_id, slug, name, options, unit_price, quantity, line_total, stock, purchasable]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        image:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
        unit_price:
          type: integer
          format: int64
        compare_at_price:
          type: [integer, "null"]
          format: int64
        quantity:
          type: integer
        line_total:
          type: integer
          format: int64
        stock:
          description: How many are in stock now.
          type: integer
        purchasable:
          description: False when the product is no longer for sale or there isn't enough stock for this quantity.
          type: boolean

    Cart:
      type: object
      required: [items, item_count, subtotal, discount_total, total, currency]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        item_count:
          type: integer
        subtotal:
          description: Sum of the purchasable lines, before shipping, discounts and any VAT added on top.
          type: integer
          format: int64
        discount:
          oneOf:
            - $ref: "#/components/schemas/CartDiscount"
            - type: "null"
        discount_total:
          description: Taken off the subtotal, in poisha; 0 without a code that applies.
          type: integer
          format: int64
        total:
          description: Subtotal less the discount, before shipping and any VAT added on top.
          type: integer
          format: int64
        currency:
          type: string
        token:
          description: Only when this response created a guest cart. Send it back as X-Cart-Token.
          type: [string, "null"]

    StaffRole:
      description: "`admin`: everything. `staff`: catalog, stock and orders."
      type: string
      enum: [staff, admin]

    StaffMember:
      type: object
      required: [id, name, email, role, disabled, created_at, you]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/StaffRole"
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        you:
          description: This is the caller's own account.
          type: boolean

    CustomerSummary:
      type: object
      required: [id, name, order_count, spent, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        order_count:
          type: integer
        spent:
          description: Totals of their orders that aren't cancelled, in poisha.
          type: integer
          format: int64
        last_order_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        disabled:
          type: boolean

    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required: [orders]
          properties:
            orders:
              type: array
              items:
                $ref: "#/components/schemas/OrderSummary"

    OrderStatus:
      type: string
      enum: [pending, confirmed, packed, shipped, delivered, cancelled]

    PaymentMethod:
      description: "`cod`: cash on delivery. Online payments come later."
      type: string
      enum: [cod]

    CheckoutInput:
      type: object
      required: [name, phone, district, area, address, payment_method]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          description: A Bangladeshi mobile number, in any common form (01712345678, +880 1712-345678).
          type: string
          minLength: 10
          maxLength: 20
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        district:
          type: string
          maxLength: 40
        area:
          description: Thana or area, e.g. "Mirpur 10".
          type: string
          minLength: 1
          maxLength: 80
        address:
          description: House, road, landmark.
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: [string, "null"]
          maxLength: 500
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"

    OrderSummary:
      type: object
      required: [id, number, status, customer_name, phone, district, payment_method, item_count, total, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/OrderStatus"
        customer_name:
          type: string
        phone:
          type: string
        district:
          type: string
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        item_count:
          type: integer
        total:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type: string
          format: date-time

    Shipment:
      type: object
      required: [provider, provider_name, status, cod_amount, created_at]
      properties:
        provider:
          type: string
        provider_name:
          type: string
        consignment_id:
          type: [string, "null"]
        tracking_code:
          type: [string, "null"]
        status:
          type: string
          description: The courier's own word, like in_review, pending, delivered or cancelled; booking while the call is under way.
        cod_amount:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          required: [area, address, subtotal, discount_total, zone_name, delivery_days, delivery_charge, vat_rate_bp, vat_included, vat_total, items, events, next_statuses]
          properties:
            shipment:
              oneOf:
                - $ref: "#/components/schemas/Shipment"
                - type: "null"
            email:
              type: [string, "null"]
            area:
              type: string
            address:
              type: string
            note:
              type: [string, "null"]
            subtotal:
              type: integer
              format: int64
            discount_code:
              type: [string, "null"]
            discount_total:
              type: integer
              format: int64
            zone_name:
              type: string
            delivery_days:
              type: string
            delivery_charge:
              type: integer
              format: int64
            vat_rate_bp:
              type: integer
            vat_included:
              description: True when the prices already included VAT (vat_total is then the part of them that was VAT).
              type: boolean
            vat_total:
              type: integer
              format: int64
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
            events:
              type: array
              items:
                $ref: "#/components/schemas/OrderEvent"
            next_statuses:
              description: Where the shop can move it next.
              type: array
              items:
                $ref: "#/components/schemas/OrderStatus"

    OrderItem:
      type: object
      required: [slug, name, options, unit_price, quantity, line_total]
      properties:
        product_id:
          type: [string, "null"]
          format: uuid
        slug:
          type: string
        name:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        sku:
          type: [string, "null"]
        unit_price:
          type: integer
          format: int64
        quantity:
          type: integer
        line_total:
          type: integer
          format: int64

    OrderEvent:
      type: object
      required: [status, created_at]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        note:
          type: [string, "null"]
        actor:
          description: Who on the shop's side made the change; null for the customer placing it.
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    ProductRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    Review:
      type: object
      required: [id, rating, body, author, mine, hidden, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
        body:
          type: string
        author:
          description: First name and last initial, e.g. "Fatima R.".
          type: string
        mine:
          type: boolean
        hidden:
          description: Hidden by the shop; only its author and the shop see it.
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        product:
          description: In the dashboard's lists only.
          $ref: "#/components/schemas/ProductRef"

    RatingSummary:
      type: object
      required: [count, stars]
      properties:
        count:
          type: integer
        average:
          type: [number, "null"]
        stars:
          description: How many reviews gave 1, 2, 3, 4 and 5 stars, in that order.
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: integer

    ReviewPage:
      type: object
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/RatingSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        mine:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
        next_cursor:
          type: [string, "null"]

    Question:
      type: object
      required: [id, body, author, mine, hidden, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          type: string
        answer:
          type: [string, "null"]
        answered_at:
          type: [string, "null"]
          format: date-time
        mine:
          type: boolean
        hidden:
          type: boolean
        created_at:
          type: string
          format: date-time
        product:
          description: In the dashboard's lists only.
          $ref: "#/components/schemas/ProductRef"

    CartDiscount:
      type: object
      required: [code, amount, applies, min_subtotal]
      properties:
        code:
          type: string
        description:
          type: [string, "null"]
        amount:
          description: Taken off, in poisha; 0 when it doesn't apply.
          type: integer
          format: int64
        applies:
          type: boolean
        reason:
          description: |
            Why it doesn't apply: `below_minimum` (add more; see min_subtotal), `not_started`,
            `ended`, `used_up` or `inactive` (it changed after it was put on the cart).
          type: [string, "null"]
          enum: [below_minimum, not_started, ended, used_up, inactive]
        min_subtotal:
          type: integer
          format: int64

    DiscountKind:
      description: "`percent`: value is a whole percentage. `fixed`: value is an amount in poisha."
      type: string
      enum: [percent, fixed]

    Discount:
      type: object
      required: [id, code, kind, value, min_subtotal, used_count, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          description: Stored in capitals; shoppers can type it in any case.
          type: string
        description:
          description: Shown to shoppers beside the code, e.g. "10% off for Eid".
          type: [string, "null"]
        kind:
          $ref: "#/components/schemas/DiscountKind"
        value:
          type: integer
          format: int64
        max_discount:
          description: For a percentage, the most it takes off, in poisha.
          type: [integer, "null"]
          format: int64
        min_subtotal:
          description: The subtotal needed for it to apply, in poisha.
          type: integer
          format: int64
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        usage_limit:
          description: How many orders may use it in all; null for no limit.
          type: [integer, "null"]
        used_count:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    DiscountInput:
      type: object
      required: [code, kind, value]
      properties:
        code:
          description: Letters, digits, - and _.
          type: string
          pattern: "^[A-Za-z0-9_-]{3,30}$"
        description:
          type: [string, "null"]
          maxLength: 120
        kind:
          $ref: "#/components/schemas/DiscountKind"
        value:
          description: 1–100 for a percentage; an amount in poisha for a fixed discount.
          type: integer
          format: int64
          minimum: 1
        max_discount:
          type: [integer, "null"]
          format: int64
          minimum: 1
        min_subtotal:
          type: integer
          format: int64
          minimum: 0
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        usage_limit:
          type: [integer, "null"]
          minimum: 1
        active:
          type: boolean

    BannerPlacement:
      description: "`hero`: the big slides at the top. `side`: beside them. `wide`: across the page lower down."
      type: string
      enum: [hero, side, wide]

    Banner:
      type: object
      required: [id, placement, image, alt, position, active]
      properties:
        id:
          type: string
          format: uuid
        placement:
          $ref: "#/components/schemas/BannerPlacement"
        image:
          $ref: "#/components/schemas/Image"
        link:
          description: Where it leads, e.g. "/c/saree" or a full https address.
          type: [string, "null"]
        alt:
          description: What the banner says, for people who can't see it.
          type: string
        position:
          type: integer
        active:
          type: boolean

    BannerInput:
      type: object
      required: [placement, image_id, alt]
      properties:
        placement:
          $ref: "#/components/schemas/BannerPlacement"
        image_id:
          type: string
          format: uuid
        link:
          type: [string, "null"]
          pattern: "^(/|https://)"
          maxLength: 500
        alt:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
        active:
          type: boolean

    Highlight:
      type: object
      required: [icon, title]
      properties:
        icon:
          type: string
          enum: [truck, cash, return, shield, phone, gift]
        title:
          type: string
          minLength: 1
          maxLength: 60
        text:
          type: [string, "null"]
          maxLength: 120

    Brand:
      type: object
      required: [name, product_count]
      properties:
        name:
          type: string
        product_count:
          type: integer
        image:
          description: The newest product photo of this brand, to show beside its name.
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"

    Overview:
      type: object
      required: [products, categories, out_of_stock, low_stock]
      properties:
        orders:
          description: Only for people who handle orders.
          oneOf:
            - $ref: "#/components/schemas/OrderStats"
            - type: "null"
        products:
          type: object
          required: [active, draft, archived]
          properties:
            active:
              type: integer
            draft:
              type: integer
            archived:
              type: integer
        categories:
          type: integer
        out_of_stock:
          description: Variants of products for sale that have none left.
          type: integer
        low_stock:
          description: Up to 10 variants of products for sale with 1 to 3 left, fewest first.
          type: array
          items:
            $ref: "#/components/schemas/LowStockItem"

    OrderStats:
      type: object
      required: [waiting, to_ship, today_orders, today_sales, week_orders, week_sales, days]
      properties:
        days:
          description: The last 14 days (Dhaka), oldest first, each with its orders and sales; cancelled left out.
          type: array
          items:
            type: object
            required: [day, orders, sales]
            properties:
              day:
                type: string
                format: date
              orders:
                type: integer
              sales:
                type: integer
                format: int64
        waiting:
          description: Placed and not yet confirmed.
          type: integer
        to_ship:
          description: Confirmed or packed, not yet shipped.
          type: integer
        today_orders:
          type: integer
        today_sales:
          description: Totals of today's orders that aren't cancelled, in poisha (Dhaka time).
          type: integer
          format: int64
        week_orders:
          type: integer
        week_sales:
          description: The same over the last 7 days, today included.
          type: integer
          format: int64

    LowStockItem:
      type: object
      required: [variant_id, product_id, name, options, stock]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        name:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        stock:
          type: integer

    District:
      type: object
      required: [name, division]
      properties:
        name:
          type: string
        division:
          type: string

    ShippingZone:
      type: object
      required: [id, name, districts, base_charge, base_weight_g, extra_per_kg, delivery_days, position, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: E.g. "Inside Dhaka".
          type: string
        districts:
          type: array
          items:
            type: string
        base_charge:
          description: Covers a parcel up to base_weight_g, in poisha.
          type: integer
          format: int64
        base_weight_g:
          type: integer
        extra_per_kg:
          description: Added for each kilogram (or part) over the base weight, in poisha.
          type: integer
          format: int64
        free_over:
          description: Orders with a subtotal at least this much deliver free, in poisha.
          type: [integer, "null"]
          format: int64
        delivery_days:
          description: How long delivery takes, as shown to shoppers, e.g. "1–2 days".
          type: string
        position:
          type: integer
        active:
          type: boolean

    ShippingZoneInput:
      type: object
      required: [name, districts, base_charge, delivery_days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        districts:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
        base_charge:
          type: integer
          format: int64
          minimum: 0
        base_weight_g:
          description: 1000 when left out.
          type: integer
          minimum: 0
          maximum: 1000000
        extra_per_kg:
          type: integer
          format: int64
          minimum: 0
        free_over:
          type: [integer, "null"]
          format: int64
          minimum: 0
        delivery_days:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 0
        active:
          type: boolean

    ShippingQuote:
      type: object
      required: [district, zone_id, zone_name, charge, free, delivery_days, weight_g, subtotal]
      properties:
        district:
          type: string
        zone_id:
          type: string
          format: uuid
        zone_name:
          type: string
        charge:
          description: What delivery costs, in poisha; 0 when free.
          type: integer
          format: int64
        free:
          description: True when the subtotal reached the zone's free-delivery amount.
          type: boolean
        delivery_days:
          type: string
        weight_g:
          description: The cart's total weight.
          type: integer
        subtotal:
          type: integer
          format: int64

    Facets:
      type: object
      required: [total, categories, brands, options]
      properties:
        total:
          description: How many products match all the filters.
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryFacet"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandFacet"
        options:
          description: Each option name with its values, most products first.
          type: array
          items:
            $ref: "#/components/schemas/OptionFacet"
        price:
          description: Cheapest and dearest among the matches, in poisha; null when nothing matches.
          oneOf:
            - $ref: "#/components/schemas/PriceRange"
            - type: "null"

    CategoryFacet:
      type: object
      required: [slug, name, count]
      properties:
        slug:
          type: string
        name:
          type: string
        count:
          type: integer

    BrandFacet:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    OptionFacet:
      type: object
      required: [name, values]
      properties:
        name:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ValueFacet"

    ValueFacet:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer

    PriceRange:
      type: object
      required: [min, max]
      properties:
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
