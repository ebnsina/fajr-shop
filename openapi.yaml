openapi: 3.1.0
info:
  title: Fajr Shop API
  version: 0.1.0
  description: |
    The only way into a Fajr shop. The storefront, admin, mobile apps and integrations all use it.

    Errors always look like `{"error": {"code": "...", "message": "...", "fields": {...}}}`.
    `code` is stable and machine-readable; show your own words for it. `message` is English and
    may change.

    Money is an integer in the currency's minor unit (poisha for BDT) and always comes with
    its `currency`.
servers:
  - url: /
tags:
  - name: system
  - name: store
  - name: auth
  - name: catalog
  - name: admin

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Is the API up and can it reach its database
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"

  /v1/store:
    get:
      operationId: getStore
      tags: [store]
      summary: The shop's public settings
      description: Name, branding, currency and VAT. Every client reads this on start.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Store settings
          headers:
            ETag:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "304":
          description: Unchanged since the given ETag
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a customer account and sign in
      description: Needs an email or a phone number, or both. Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email or phone and password
      description: |
        A wrong password and an unknown account give the same `invalid_credentials` error.
        Rate-limited per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Swap a refresh token for a new pair
      description: |
        Every refresh token works once. Using one twice ends the session for everyone holding it
        (`session_expired`); sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End this session
      security:
        - bearer: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/store:
    put:
      operationId: updateStore
      tags: [admin]
      summary: Change the shop's settings
      description: "Needs `store:write`. Send every field; a missing optional field is cleared."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: Active API keys
      description: Needs `api_keys:manage` and a signed-in user. Returns at most 200.
      security:
        - bearer: []
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      tags: [admin]
      summary: Create an API key for an integration
      description: The key is in this response only. It cannot be shown again.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [admin]
      summary: Revoke an API key; it stops working at once
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/audit-log:
    get:
      operationId: listAuditLog
      tags: [admin]
      summary: Who changed what, newest first
      description: Needs `audit:read`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Error"

  /v1/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: Every category, in display order
      description: A flat list; build the tree from `parent_id`. At most 500.
      responses:
        "200":
          description: Categories
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"

  /v1/products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Products for sale, filtered and sorted
      parameters:
        - name: q
          in: query
          description: Words to search for in names and descriptions.
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          description: A category slug; products in its subcategories are included.
          schema:
            type: string
            maxLength: 100
        - name: min_price
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: in_stock
          in: query
          schema:
            type: boolean
        - name: option
          in: query
          description: "Only products with a variant having this option, as `Name:Value` (e.g. `Color:Red`). Repeat to require several."
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, name]
            default: newest
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"

  /v1/products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: One product for sale, with its variants and images
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/categories:
    post:
      operationId: createCategory
      tags: [admin]
      summary: Add a category
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateCategory
      tags: [admin]
      summary: Rename, move or reorder a category
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Remove a category
      description: "Needs `catalog:write`. Refused with `in_use` while it has products or subcategories."
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: Every product, drafts and archived included, newest first
      description: Needs `catalog:write`.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Add a product
      description: Needs `catalog:write`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminGetProduct
      tags: [admin]
      summary: One product, whatever its status
      description: Needs `catalog:write`.
      security:
        - bearer: []
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Replace a product's details, options, variants and images
      description: |
        Needs `catalog:write`. Variants are matched by `id`; one left out is removed, one without an
        `id` is added. An existing variant's `stock` is ignored here: change it with a stock adjustment,
        so a form opened before a sale can't undo it.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Remove a product for good
      description: Needs `catalog:write`. To hide it but keep it, set its status to `archived`.
      security:
        - bearer: []
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/variants/{id}/stock-adjustments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adjustStock
      tags: [admin]
      summary: Add to or take from a variant's stock, saying why
      description: "Needs `inventory:write`. Refused with `insufficient_stock` if it would go below zero."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustment"
      responses:
        "200":
          description: The variant, with its new stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/uploads:
    post:
      operationId: uploadImage
      tags: [admin]
      summary: Upload a JPEG, PNG or WebP image, up to 10 MB
      description: Needs `catalog:write` or `store:write`. Use the returned `id` in a product's `image_ids`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token from sign-in (`fsa_…`) or an API key (`fsk_…`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: "`next_cursor` from the previous page."
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error:
      description: Something went wrong; `error.code` says what
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            fields:
              description: Per-field problems, keyed by field path.
              type: object
              additionalProperties:
                type: string

    ErrorCode:
      type: string
      enum:
        - validation
        - not_found
        - method_not_allowed
        - unauthenticated
        - session_expired
        - forbidden
        - invalid_credentials
        - account_exists
        - in_use
        - insufficient_stock
        - too_large
        - unsupported_type
        - rate_limited
        - internal

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Store:
      type: object
      required: [name, currency, vat]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        logo_url:
          type: [string, "null"]
          maxLength: 500
        accent_color:
          description: Hex color, e.g. "#0f766e".
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        currency:
          description: ISO 4217 code.
          type: string
          pattern: "^[A-Z]{3}$"
        contact_phone:
          type: [string, "null"]
          maxLength: 20
        contact_email:
          type: [string, "null"]
          format: email
          maxLength: 254
        vat:
          $ref: "#/components/schemas/Vat"

    Vat:
      type: object
      required: [enabled, rate_bp, prices_include_vat]
      properties:
        enabled:
          type: boolean
        rate_bp:
          description: Default rate in basis points (500 = 5%).
          type: integer
          minimum: 0
          maximum: 10000
        prices_include_vat:
          type: boolean
        bin:
          description: Business Identification Number, printed on Mushak-6.3 invoices.
          type: [string, "null"]
          maxLength: 20

    Role:
      type: string
      enum: [customer, staff, admin]

    Permission:
      description: What a user's role or an API key allows.
      type: string
      enum: [store:write, catalog:write, inventory:write, api_keys:manage, audit:read]

    ApiKeyScope:
      description: What an API key may do. Managing keys is for signed-in people only.
      type: string
      enum: [store:write, catalog:write, inventory:write, audit:read]

    User:
      type: object
      required: [id, role, name, permissions, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        email:
          type: [string, "null"]
        phone:
          description: E.164, e.g. "+8801712345678".
          type: [string, "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          description: A Bangladeshi mobile number, e.g. "01712345678".
          type: string
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          description: Email or phone number.
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200

    Session:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ApiKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"

    ApiKey:
      type: object
      required: [id, name, hint, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          description: The key's last four characters.
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string

    AuditEntry:
      type: object
      required: [id, action, entity, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          description: Who did it, or null for the system.
          type: [string, "null"]
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: [string, "null"]
        before: {}
        after: {}
        created_at:
          type: string
          format: date-time

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: [string, "null"]

    Category:
      type: object
      required: [id, name, slug, position]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        slug:
          type: string
        position:
          description: Order among its siblings, from 0.
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          description: Made from the name when left out.
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
        parent_id:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
          minimum: 0

    ProductStatus:
      description: Only `active` products are for sale.
      type: string
      enum: [draft, active, archived]

    Image:
      type: object
      required: [id, url, width, height]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        alt:
          type: string
        width:
          type: integer
        height:
          type: integer

    ProductOption:
      type: object
      required: [name, values]
      properties:
        name:
          description: E.g. "Size" or "Color".
          type: string
          minLength: 1
          maxLength: 40
        values:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40

    Variant:
      type: object
      required: [id, price, stock, options]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: [string, "null"]
        price:
          type: integer
          format: int64
        compare_at_price:
          description: The old price, shown struck through, when on sale.
          type: [integer, "null"]
          format: int64
        stock:
          type: integer
        options:
          description: 'This variant''s value for each of the product''s options, e.g. {"Size": "M"}.'
          type: object
          additionalProperties:
            type: string

    VariantInput:
      type: object
      required: [price, options]
      properties:
        id:
          description: An existing variant to keep; leave out to add a new one.
          type: string
          format: uuid
        sku:
          type: [string, "null"]
          maxLength: 64
        price:
          type: integer
          format: int64
          minimum: 0
        compare_at_price:
          type: [integer, "null"]
          format: int64
          minimum: 0
        stock:
          description: Starting stock for a new variant. Ignored for an existing one.
          type: integer
          minimum: 0
        options:
          type: object
          additionalProperties:
            type: string

    Product:
      type: object
      required: [id, slug, name, description, status, currency, options, variants, images, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        currency:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name, status, options, variants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          description: Made from the name when left out.
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          maxLength: 100
        description:
          type: string
          maxLength: 20000
        status:
          $ref: "#/components/schemas/ProductStatus"
        category_id:
          type: [string, "null"]
          format: uuid
        options:
          description: Up to three, e.g. Size and Color. Empty for a product with one variant.
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          description: One per combination of option values you sell.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/VariantInput"
        image_ids:
          description: Uploaded images, in display order; the first is the main one.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid

    ProductSummary:
      type: object
      required: [id, slug, name, status, price_min, price_max, currency, in_stock]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        price_min:
          type: integer
          format: int64
        price_max:
          type: integer
          format: int64
        compare_at_price:
          description: The old price of the cheapest variant, when it is on sale.
          type: [integer, "null"]
          format: int64
        currency:
          type: string
        in_stock:
          type: boolean
        image:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"

    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        next_cursor:
          type: [string, "null"]

    StockAdjustment:
      type: object
      required: [delta, reason]
      properties:
        delta:
          description: Positive adds, negative takes away. Not zero.
          type: integer
          minimum: -100000
          maximum: 100000
        reason:
          type: string
          enum: [received, damaged, lost, returned, correction]
        note:
          type: string
          maxLength: 200
